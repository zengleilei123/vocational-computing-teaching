name: Student target acceptance harness

on:
  push:
    branches: [main]
    paths:
      - 'acceptance/**'
      - 'teacher_reference/robot_map_portfolio/**'
      - 'projects/robot_playground/**'
      - 'classroom/robot_portfolio/**'
      - '.github/workflows/student-acceptance.yml'
  pull_request:
    branches: [main]
    paths:
      - 'acceptance/**'
      - 'teacher_reference/robot_map_portfolio/**'
      - 'projects/robot_playground/**'
      - 'classroom/robot_portfolio/**'
      - '.github/workflows/student-acceptance.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  report-and-configuration:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-latest]
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check report integrity and target configuration without browser dependencies
        run: python -m unittest acceptance.robot_portfolio.tests.test_runner -v

  real-browser-controls:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHONUTF8: '1'
      ROBOT_ACCEPTANCE_TEST_EVIDENCE: reports/harness-controls
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install the existing browser test stack
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify explicit targets, independent UI variants and deliberate storage fault
        run: python -m unittest acceptance.robot_portfolio.tests.test_integration -v
      - name: Preserve calibration and negative-control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-acceptance-harness-evidence
          path: reports/harness-controls/
          if-no-files-found: warn
          retention-days: 14
