name: Teaching repository checks

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile Python sources
        run: python -m compileall -q curriculum

      - name: Test Python basics lesson
        run: python -m unittest discover -s curriculum/python-programming/01-basics -p "test_*.py" -v

      - name: Test deterministic tool-calling lesson
        run: python -m unittest discover -s curriculum/ai-agent-development/01-tool-calling -p "test_*.py" -v

      - name: Test LLM tool-calling orchestration offline
        run: python -m unittest discover -s curriculum/ai-agent-development/02-llm-tool-calling -p "test_*.py" -v

      - name: Test RAG retrieval lesson
        run: python -m unittest discover -s curriculum/ai-agent-development/03-rag -p "test_*.py" -v

      - name: Validate evaluation JSON
        run: python -m json.tool curriculum/ai-agent-development/01-tool-calling/evaluation-cases.json > /dev/null
